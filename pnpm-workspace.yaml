packages:
  - apps/*
  - packages/*

# Shared versions. Apps and packages use "catalog:" instead of a version.
catalog:
  # api
  express: ^5.3.0
  cors: ^2.8.6
  prisma: 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-better-sqlite3': 7.10.1
  socket.io: ^4.8.4
  socket.io-client: ^4.8.4
  zod: ^4.6.7
  supertest: ^7.3.1
  # frontend
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.18.5
  '@tanstack/react-query': ^5.105.1
  vite: ^8.3.5
  '@vitejs/plugin-react': ^6.1.2
  next: ^16.4.3
  electron: ^45.2.1
  electron-vite: ^6.0.0
  electron-builder: ^26.18.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  # tooling
  vitest: ^5.0.5
  turbo: ^2.11.10
  prettier: ^3.9.10
  eslint: ^10.14.0
  '@eslint/js': ^10.0.1
  globals: ^17.14.0
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1

# pnpm blocks install scripts unless the package is listed here.
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  prisma: true
  '@prisma/engines': true
  better-sqlite3: true

minimumReleaseAgeExclude:
  - globals@17.14.0
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/react-query@5.105.1'
